spring.application.name=signal

spring.datasource.url=jdbc:sqlite:D:/Softwares/sqlite/signals.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

kite.api_key=your_kite_api_key
kite.api_secret=your_kite_api_secret
kite.user_id=your_user_id
kite.dry_run=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
logging.level.org.springframework.web.servlet.view=DEBUG

weekly.this.month.this.week=NIFTY25710
weekly.this.month.subsequent.weeks=NIFTY25717,NIFTY25724
weekly.next.month.subsequent.weeks=

monthly.this.month=NIFTY25JUL
monthly.next.subsequent.months=NIFTY25AUG,NIFTY25SEP
